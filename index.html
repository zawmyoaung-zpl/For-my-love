<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

    <title>Suprise Card</title>
    <style>
        body {
            margin: 0;
            background-color: #111;
            overflow: hidden;
            font-family: sans-serif;
            -webkit-user-select: none;
            -ms-user-select: none;
            user-select: none;
        }

        #overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #ffeef5;
            z-index: 999;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }

    .bt {
          display: inline-block;
          background: rgba(255,255,255,0.1);
          backdrop-filter: blur(10px);
          color: #fff;
          padding: 5px 15px;
          border: 1px solid #fff;
          border-radius: 20px;
          font-size: 1em;
          font-weight:bold;
          animation: fadeInScale 1s ease-out forwards;animation-delay: 13s;
          opacity: 0;
          
          font-family: Times New Roman;
    }
      .bt:hover { background: pink; 
                  color: white; }

      .countdown-container {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 100;
            pointer-events: none;
        }

        .timer {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 15rem;
            font-weight: bold;
            color: gold;
            opacity: 0;
            animation: countOut 1s linear forwards;
            font-family:Times New Roman;
        }

        .timer:nth-child(1) { animation-delay: 0s; }
        .timer:nth-child(2) { animation-delay: 1s; }
        .timer:nth-child(3) { animation-delay: 2s; }
        .timer:nth-child(4) { animation-delay: 3s; }
        .timer:nth-child(5) { animation-delay: 4s; }
        .timer:nth-child(6) { animation-delay: 5s; }

        @keyframes countOut {
            0% { transform: translate(-50%, -50%) scale(0); opacity: 0; }
            50% { transform: translate(-50%, -50%) scale(1.2); opacity: 1; }
            100% { transform: translate(-50%, -50%) scale(1); opacity: 0; }
        }

        #c { display: none; }
.container {
            perspective: 1000px; 
        }
        .card {
            width: 340px;
            height: 240px;
            background: linear-gradient(rgba(0,0,0,0.3), rgba(0,0,0,0.3)), url('card01.jpg');
            background-size: cover;
            background-position: center;
            border-radius: 10px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
            position: relative;
            padding: 20px;
            box-sizing: border-box;
            text-align: center;
            font-family: Times New Roman;
            transform-style: preserve-3d;
            animation: flipEntrance 3s cubic-bezier(0.4, 0, 0.2, 1) forwards;
        }

        /* တစ်ပတ်လှည့်ဝင်လာမယ့် Keyframes */
        @keyframes flipEntrance {
            0% {
                opacity: 0;
                transform: translateX(-200px) rotateY(0deg) scale(0.5);
            }
            100% {
                opacity: 1;
                transform: translateX(0) rotateY(360deg) scale(1);
            }
        } 
    
    
    
@keyframes fadeInScale { 
    0% { opacity: 0; transform: scale(0);}
  100% { opacity: 1; transform: scale(1); } }
@keyframes fadeIn { to { opacity: 1; } }
        @keyframes fadeInBlur {
            0% { opacity: 0; filter: blur(10px); transform: translateY(20px); }
            100% { opacity: 1; filter: blur(0); transform: translateY(0); }
        }

        @keyframes shimmer {
            0% { background-position: -200%; }
            100% { background-position: 200%; }
        }

        @keyframes softFloat {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        @keyframes letterSpread {
            0% { letter-spacing: -5px; opacity: 0; }
            100% { letter-spacing: 3px; opacity: 1; }
        }
        .a { 
            color: #FFD700;
            font-size: 2rem;
            margin: 10px 0 0 0;
            opacity: 0;
            animation: fadeInBlur 2s ease-out forwards;
            animation-delay: 3.5s;
        }

        .b { 
            font-size: 2.5rem;
            margin: 0;
            font-weight: bold;
            /* Shimmer Effect */
            background: linear-gradient(90deg, #FFD700, #fff, #FFD700);
            background-size: 200%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            opacity: 0;
            animation: fadeInBlur 2s ease-out forwards, shimmer 3s linear infinite;
            animation-delay: 5.5s;
        }

        .ktm { 
            color: white;
            font-size: 1rem;
            margin: 5px 0;
            opacity: 0;
            animation: letterSpread 2s ease-out forwards;
            animation-delay: 7.5s;
        }

        .c { 
            color: #eee;
            font-size: 0.9rem;
            margin: 5px 0;
            opacity: 0;
            animation: fadeInBlur 2s ease-out forwards;
            animation-delay: 9s;
        }

        .d { 
            color: #ccc;
            font-size: 0.7rem;
            letter-spacing: 2px;
            margin-top: 10px;
            opacity: 0;
            animation: fadeInBlur 1s ease-out forwards;
            animation-delay: 11s;
        }

        .bt {
            display: inline-block;
            position: relative;
            margin-top: 15px;
            background: rgba(255,255,255,0.2);
            backdrop-filter: blur(5px);
            color: #fff;
            padding: 8px 25px;
            border: 1px solid #fff;
            border-radius: 25px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
            opacity: 0;
            animation: fadeInBlur 1s ease-out forwards;
            animation-delay: 12s;
        }

        .bt:hover { 
            background: gold; 
            color: black; 
            transform: scale(1.1);
        }
    </style>
</head>
<body>

<div id="overlay">
  <div class="container">
  <div class="card">
    <p class="a">Happy</p>
    <p class="b">BIRTHDAY</p>
    <p class="ktm">My Love</p>
    <p class="d">FRIDAY JUNE 19, 2026</p>
    
  <button onclick="startSurprise()" class="bt">OPEN</button>
  </div>
  </div>
</div>

<div class="countdown-container" id="timer-box" style="display:none;">
    <div class="timer">5</div>
    <div class="timer">4</div>
    <div class="timer">3</div>
    <div class="timer">2</div>
    <div class="timer">1</div>
    <div class="timer">Go!</div>
</div>
<audio id="hbdMusic" src="cheer.mp3" preload="auto"></audio>
<canvas id="c"></canvas>

<script>
    const c = document.getElementById('c');
    const ctx = c.getContext("2d");
    let w = (c.width = window.innerWidth);
    let h = (c.height = window.innerHeight);
    let hw = w / 2;
    let hh = h / 2;

    const opts = {
        strings: ["HAPPY", "BIRTHDAY!"],
        charSize: 50, 
        charSpacing: 45,
        lineHeight: 60,
        fireworkPrevPoints: 15, // အမြီးတန်းကို ပိုရှည်စေတယ်
        fireworkBaseLineWidth: 8,
        fireworkAddedLineWidth: 12,
        fireworkSpawnTime: 120, // မီးပန်းတွေ ပိုမြန်မြန်တက်လာမယ်
        fireworkBaseReachTime: 30,
        fireworkAddedReachTime: 30,
        fireworkCircleBaseSize: 35, // အလင်းစက် ပိုကြီးမယ်
        fireworkCircleAddedSize: 20,
        fireworkCircleBaseTime: 30,
        fireworkCircleAddedTime: 30,
        fireworkCircleFadeBaseTime: 10,
        fireworkCircleFadeAddedTime: 5,
        fireworkBaseShards: 20, // အမှုန်အမွှား ပိုများမယ်
        fireworkAddedShards: 15,
        fireworkShardPrevPoints: 5,
        fireworkShardBaseVel: 6,
        fireworkShardAddedVel: 4,
        fireworkShardBaseSize: 4,
        fireworkShardAddedSize: 4,
        gravity: 0.15, // အောက်ကို ပြန်ကျတဲ့အရှိန်
        holdTime: 500, // စာသားပေါ်နေမယ့်ကြာချိန်
    };


    const calc = {
        totalWidth: opts.charSpacing * Math.max(opts.strings[0].length, opts.strings[1].length),
    };

    const Tau = Math.PI * 2;
    const TauQuarter = Tau / 4;
    let letters = [];
    let surpriseStarted = false;

function startSurprise() {
    var audio = document.getElementById('hbdMusic');
    document.getElementById('overlay').style.display = 'none';
    document.getElementById('timer-box').style.display = 'block';
    audio.play().then(() => {
        audio.pause();
        audio.currentTime = 0;
        
        setTimeout(function() {
          document.getElementById('c').style.display = 'block';
            surpriseStarted = true;
            audio.play();
        }, 6000);
    }).catch(error => {
        console.log("Playback failed:", error);
    });
}

    function Letter(char, x, y) {
        this.char = char;
        this.x = x;
        this.y = y;
        this.dx = -ctx.measureText(char).width / 2;
        this.dy = +opts.charSize / 2;
        this.fireworkDy = this.y - hh;
        let hue = (x / calc.totalWidth) * 360;
        this.alphaColor = "hsla(hue,80%,50%,alp)".replace("hue", hue);
        this.lightAlphaColor = "hsla(hue,80%,light%,alp%)".replace("hue", hue);
        this.lightColor = "hsl(hue,80%,light%)".replace("hue", hue);
        this.reset();
    }

    Letter.prototype.reset = function () {
        this.phase = "firework";
        this.tick = 0;
        this.spawned = false;
        this.spawningTime = (opts.fireworkSpawnTime * Math.random()) | 0;
        this.reachTime = (opts.fireworkBaseReachTime + opts.fireworkAddedReachTime * Math.random()) | 0;
        this.lineWidth = opts.fireworkBaseLineWidth + opts.fireworkAddedLineWidth * Math.random();
        this.prevPoints = [[0, hh, 0]];
    };

    Letter.prototype.step = function () {
        if (this.phase === "firework") {
            if (!this.spawned) {
                ++this.tick;
                if (this.tick >= this.spawningTime) {
                    this.tick = 0;
                    this.spawned = true;
                }
            } else {
                ++this.tick;
                let linearProportion = this.tick / this.reachTime,
                    armonicProportion = Math.sin(linearProportion * TauQuarter),
                    x = linearProportion * this.x,
                    y = hh + armonicProportion * this.fireworkDy;

                if (this.prevPoints.length > opts.fireworkPrevPoints) this.prevPoints.shift();
                this.prevPoints.push([x, y, linearProportion * this.lineWidth]);

                let lineWidthProportion = 1 / (this.prevPoints.length - 1);
                for (let i = 1; i < this.prevPoints.length; ++i) {
                    let point = this.prevPoints[i],
                        point2 = this.prevPoints[i - 1];
                    ctx.strokeStyle = this.alphaColor.replace("alp", i / this.prevPoints.length);
                    ctx.lineWidth = point[2] * lineWidthProportion * i;
                    ctx.beginPath();
                    ctx.moveTo(point[0], point[1]);
                    ctx.lineTo(point2[0], point2[1]);
                    ctx.stroke();
                }

                if (this.tick >= this.reachTime) {
                    this.phase = "contemplate";
                    this.circleFinalSize = opts.fireworkCircleBaseSize + opts.fireworkCircleAddedSize * Math.random();
                    this.circleCompleteTime = (opts.fireworkCircleBaseTime + opts.fireworkCircleAddedTime * Math.random()) | 0;
                    this.circleCreating = true;
                    this.circleFading = false;
                    this.circleFadeTime = (opts.fireworkCircleFadeBaseTime + opts.fireworkCircleFadeAddedTime * Math.random()) | 0;
                    this.tick = 0;
                    this.tick2 = 0;
                    this.shards = [];
                    let shardCount = (opts.fireworkBaseShards + opts.fireworkAddedShards * Math.random()) | 0,
                        angle = Tau / shardCount;
                    for (let i = 0; i < shardCount; ++i) {
                        this.shards.push(new Shard(this.x, this.y, Math.cos(angle * i), Math.sin(angle * i), this.alphaColor));
                    }
                }
            }
        } else if (this.phase === "contemplate") {
            ++this.tick;
            if (this.circleCreating) {
                ++this.tick2;
                let proportion = this.tick2 / this.circleCompleteTime,
                    armonic = -Math.cos(proportion * Math.PI) / 2 + 0.5;
                ctx.fillStyle = this.lightAlphaColor.replace("light", 50 + 50 * proportion).replace("alp", proportion);
                ctx.beginPath();
                ctx.arc(this.x, this.y, armonic * this.circleFinalSize, 0, Tau);
                ctx.fill();
                if (this.tick2 > this.circleCompleteTime) {
                    this.tick2 = 0;
                    this.circleCreating = false;
                    this.circleFading = true;
                }
            } else if (this.circleFading) {
                ctx.fillStyle = this.lightColor.replace("light", 70);
                ctx.fillText(this.char, this.x + this.dx, this.y + this.dy);
                ++this.tick2;
                let proportion = this.tick2 / this.circleFadeTime,
                    armonic = -Math.cos(proportion * Math.PI) / 2 + 0.5;
                ctx.fillStyle = this.lightAlphaColor.replace("light", 100).replace("alp", 1 - armonic);
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.circleFinalSize, 0, Tau);
                ctx.fill();
                if (this.tick2 >= this.circleFadeTime) this.circleFading = false;
            } else {
                ctx.fillStyle = this.lightColor.replace("light", 70);
                ctx.fillText(this.char, this.x + this.dx, this.y + this.dy);
            }

            for (let i = 0; i < this.shards.length; ++i) {
                this.shards[i].step();
                if (!this.shards[i].alive) {
                    this.shards.splice(i, 1);
                    --i;
                }
            }

            // ဤနေရာတွင် holdTime ကိုသုံးပြီး ကြာကြာပေါ်အောင် လုပ်ထားပါသည်
            if (this.tick > opts.holdTime) {
                this.phase = "exit";
                this.tick = 0;
                this.exitShards = [];
                for (let i = 0; i < 12; ++i) {
                    let angle = (Tau / 12) * i;
                    this.exitShards.push(new Shard(this.x, this.y, Math.cos(angle), Math.sin(angle), this.alphaColor));
                }
            }
        } else if (this.phase === "exit") {
            ++this.tick;
            ctx.fillStyle = this.lightColor.replace("light", 70);
            ctx.globalAlpha = Math.max(0, 1 - this.tick / 30);
            ctx.fillText(this.char, this.x + this.dx, this.y + this.dy);
            ctx.globalAlpha = 1;

            for (let i = 0; i < this.exitShards.length; ++i) {
                this.exitShards[i].step();
                if (!this.exitShards[i].alive) {
                    this.exitShards.splice(i, 1);
                    --i;
                }
            }
            if (this.tick > 30 && this.exitShards.length === 0) this.phase = "done";
        }
    };

    function Shard(x, y, vx, vy, color) {
        let vel = opts.fireworkShardBaseVel + opts.fireworkShardAddedVel * Math.random();
        this.vx = vx * vel;
        this.vy = vy * vel;
        this.x = x;
        this.y = y;
        this.prevPoints = [[x, y]];
        this.color = color;
        this.alive = true;
        this.size = opts.fireworkShardBaseSize + opts.fireworkShardAddedSize * Math.random();
    }

    Shard.prototype.step = function () {
        this.x += this.vx;
        this.y += (this.vy += opts.gravity);
        if (this.prevPoints.length > opts.fireworkShardPrevPoints) this.prevPoints.shift();
        this.prevPoints.push([this.x, this.y]);
        let lineWidthProportion = this.size / this.prevPoints.length;
        for (let k = 0; k < this.prevPoints.length - 1; ++k) {
            let point = this.prevPoints[k],
                point2 = this.prevPoints[k + 1];
            ctx.strokeStyle = this.color.replace("alp", k / this.prevPoints.length);
            ctx.lineWidth = k * lineWidthProportion;
            ctx.beginPath();
            ctx.moveTo(point[0], point[1]);
            ctx.lineTo(point2[0], point2[1]);
            ctx.stroke();
        }
        if (this.prevPoints[0][1] > hh) this.alive = false;
    };

    function anim() {
        window.requestAnimationFrame(anim);
        ctx.fillStyle = "#111";
        ctx.fillRect(0, 0, w, h);

        if (!surpriseStarted) return;

        ctx.translate(hw, hh);
        
        // မျဉ်းနှစ်ကြောင်း (strokeRect) ကို ဖျောက်ထားပါသည်

        let allDone = true;
        for (let l = 0; l < letters.length; ++l) {
            letters[l].step();
            if (letters[l].phase !== "done") allDone = false;
        }

        ctx.translate(-hw, -hh);
        if (allDone) {
            setTimeout(function() {
                window.location.href = "app.html";
            }, 100); // Animation ပြီးပြီးချင်း ၁ စက္ကန့်အကြာမှာ page ပြောင်းပါမယ်
        }
    }

    ctx.font = opts.charSize + "px Times New Roman";
    for (let i = 0; i < opts.strings.length; ++i) {
        for (let j = 0; j < opts.strings[i].length; ++j) {
            letters.push(new Letter(
                opts.strings[i][j],
                j * opts.charSpacing + opts.charSpacing / 2 - (opts.strings[i].length * opts.charSpacing) / 2,
                i * opts.lineHeight + opts.lineHeight / 2 - (opts.strings.length * opts.lineHeight) / 2
            ));
        }
    }

    window.onresize = function () {
        w = c.width = window.innerWidth;
        h = c.height = window.innerHeight;
        hw = w / 2;
        hh = h / 2;
        ctx.font = opts.charSize + "px Times New Roman";
    };

    anim();
</script>

</body>
</html>
