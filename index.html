<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

    <title>Suprise Card</title>
    <style>
        body {
            margin: 0;
            background-color: #111;
            overflow: hidden;
            font-family: sans-serif;
            -webkit-user-select: none;
            -ms-user-select: none;
            user-select: none;
        }

        #overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #ffeef5;
            z-index: 999;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }

    .bt {
          display: inline-block;
          background: rgba(255,255,255,0.1);
          backdrop-filter: blur(10px);
          color: #fff;
          padding: 5px 15px;
          border: 1px solid #fff;
          border-radius: 20px;
          font-size: 1em;
          font-weight:bold;
          animation: fadeInScale 1s ease-out forwards;animation-delay: 13s;
          opacity: 0;
          
          font-family: Times New Roman;
    }
      .bt:hover { background: pink; 
                  color: white; }

      .countdown-container {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 100;
            pointer-events: none;
        }

        .timer {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 15rem;
            font-weight: bold;
            color: gold;
            opacity: 0;
            animation: countOut 1s linear forwards;
            font-family:Times New Roman;
        }

        .timer:nth-child(1) { animation-delay: 0s; }
        .timer:nth-child(2) { animation-delay: 1s; }
        .timer:nth-child(3) { animation-delay: 2s; }
        .timer:nth-child(4) { animation-delay: 3s; }
        .timer:nth-child(5) { animation-delay: 4s; }
        .timer:nth-child(6) { animation-delay: 5s; }

        @keyframes countOut {
            0% { transform: translate(-50%, -50%) scale(0); opacity: 0; }
            50% { transform: translate(-50%, -50%) scale(1.2); opacity: 1; }
            100% { transform: translate(-50%, -50%) scale(1); opacity: 0; }
        }

        #c { display: none; }
.container {
            perspective: 1000px; 
        }
        .card {
            width: 340px;
            height: 240px;
            background: linear-gradient(rgba(0,0,0,0.3), rgba(0,0,0,0.3)), url('card01.jpg');
            background-size: cover;
            background-position: center;
            border-radius: 10px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
            position: relative;
            padding: 20px;
            box-sizing: border-box;
            text-align: center;
            font-family: Times New Roman;
            transform-style: preserve-3d;
            animation: flipEntrance 3s cubic-bezier(0.4, 0, 0.2, 1) forwards;
        }

        /* တစ်ပတ်လှည့်ဝင်လာမယ့် Keyframes */
        @keyframes flipEntrance {
            0% {
                opacity: 0;
                transform: translateX(-200px) rotateY(0deg) scale(0.5);
            }
            100% {
                opacity: 1;
                transform: translateX(0) rotateY(360deg) scale(1);
            }
        } 
    
    
    
@keyframes fadeInScale { 
    0% { opacity: 0; transform: scale(0);}
  100% { opacity: 1; transform: scale(1); } }
@keyframes fadeIn { to { opacity: 1; } }
        @keyframes fadeInBlur {
            0% { opacity: 0; filter: blur(10px); transform: translateY(20px); }
            100% { opacity: 1; filter: blur(0); transform: translateY(0); }
        }

        @keyframes shimmer {
            0% { background-position: -200%; }
            100% { background-position: 200%; }
        }

        @keyframes softFloat {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        @keyframes letterSpread {
            0% { letter-spacing: -5px; opacity: 0; }
            100% { letter-spacing: 3px; opacity: 1; }
        }
        .a { 
            color: #FFD700;
            font-size: 2rem;
            margin: 10px 0 0 0;
            opacity: 0;
            animation: fadeInBlur 2s ease-out forwards;
            animation-delay: 3.5s;
        }

        .b { 
            font-size: 2.5rem;
            margin: 0;
            font-weight: bold;
            /* Shimmer Effect */
            background: linear-gradient(90deg, #FFD700, #fff, #FFD700);
            background-size: 200%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            opacity: 0;
            animation: fadeInBlur 2s ease-out forwards, shimmer 3s linear infinite;
            animation-delay: 5.5s;
        }

        .ktm { 
            color: white;
            font-size: 1rem;
            margin: 5px 0;
            opacity: 0;
            animation: letterSpread 2s ease-out forwards;
            animation-delay: 7.5s;
        }

        .c { 
            color: #eee;
            font-size: 0.9rem;
            margin: 5px 0;
            opacity: 0;
            animation: fadeInBlur 2s ease-out forwards;
            animation-delay: 9s;
        }

        .d { 
            color: #ccc;
            font-size: 0.7rem;
            letter-spacing: 2px;
            margin-top: 10px;
            opacity: 0;
            animation: fadeInBlur 1s ease-out forwards;
            animation-delay: 11s;
        }

        .bt {
            display: inline-block;
            position: relative;
            margin-top: 15px;
            background: rgba(255,255,255,0.2);
            backdrop-filter: blur(5px);
            color: #fff;
            padding: 8px 25px;
            border: 1px solid #fff;
            border-radius: 25px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
            opacity: 0;
            animation: fadeInBlur 1s ease-out forwards;
            animation-delay: 12s;
        }

        .bt:hover { 
            background: gold; 
            color: black; 
            transform: scale(1.1);
        }
    </style>
</head>
<body>

<div id="overlay">
  <div class="container">
  <div class="card">
    <p class="a">Happy</p>
    <p class="b">BIRTHDAY</p>
    <p class="ktm">My Love</p>
    <p class="d">FRIDAY JUNE 19, 2026</p>
    
  <button onclick="startSurprise()" class="bt">OPEN</button>
  </div>
  </div>
</div>

<div class="countdown-container" id="timer-box" style="display:none;">
    <div class="timer">5</div>
    <div class="timer">4</div>
    <div class="timer">3</div>
    <div class="timer">2</div>
    <div class="timer">1</div>
    <div class="timer">Go!</div>
</div>
<audio id="hbdMusic" src="cheer.mp3" preload="auto"></audio>

<script>
function startSurprise() {
    // ၁။ Overlay ကို ဖျောက်မယ်
    document.getElementById("overlay").style.display = "none";
    
    // ၂။ Countdown ကို ပြမယ်
    const timerBox = document.getElementById("timer-box");
    timerBox.style.display = "block";
    
    // ၄။ Countdown ၆ စက္ကန့် (6000ms) ကြာပြီးနောက် အခြား Link သို့သွားမယ်
    setTimeout(function() {
        window.location.href = "app.html"; // ဒီနေရာမှာ သင်သွားချင်တဲ့ Link ကိုထည့်ပါ
    }, 6000); 
}
</script>

</body>
</html>
